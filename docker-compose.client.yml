# Desktop client stack: Screenpipe + OCR + activity capture, syncs to central server.
# Start: ./scripts/desktop-client-setup.sh --server-url http://SERVER:8000
services:
  jarvis-client:
    build:
      context: .
      dockerfile: Dockerfile.client
    container_name: jarvis-bot-client
    network_mode: host
    env_file:
      - .env
    environment:
      APP_ROLE: client
      WHATSAPP_ONLY_MODE: "false"
      RUNNING_IN_DOCKER: "true"
      DATABASE_URL: sqlite:////app/data/client-buffer.db
      CHROMA_ENABLED: "false"
      SUMMARY_ENABLED: "false"
      WHATSAPP_ENABLED: "false"
      SCREENPIPE_ENABLED: "true"
      SCREENPIPE_START_CLI: "true"
      SCREENPIPE_API_URL: http://127.0.0.1:3030
      SCREENPIPE_CLI_COMMAND: ${SCREENPIPE_CLI_COMMAND:-screenpipe record --audio-all}
      SCREENPIPE_API_TOKEN: ${SCREENPIPE_API_TOKEN:-}
      SCREENPIPE_LOCAL_API_KEY: ${SCREENPIPE_LOCAL_API_KEY:-}
      JARVIS_SERVER_URL: ${JARVIS_SERVER_URL:-http://127.0.0.1:8000}
      SYNC_API_KEY: ${SYNC_API_KEY:-}
      SYNC_ENABLED: ${SYNC_ENABLED:-true}
      DISPLAY: ${DISPLAY:-:0}
      XAUTHORITY: /tmp/.Xauthority
      HOST_UID: ${HOST_UID:-1000}
      XDG_RUNTIME_DIR: /run/user/${HOST_UID:-1000}
      PULSE_SERVER: unix:/run/user/${HOST_UID:-1000}/pulse/native
    volumes:
      - ./data:/app/data
      - ./media:/app/media
      - ${HOME}/.screenpipe:/root/.screenpipe
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ./data/.jarvis-xauthority:/tmp/.Xauthority:ro
      - /run/user/${HOST_UID:-1000}/pulse:/run/user/${HOST_UID:-1000}/pulse:rw
    devices:
      - /dev/dri:/dev/dri
      - /dev/snd:/dev/snd
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 180s
