name: Build Desktop Client

on:
  workflow_dispatch:
  push:
    branches: [frontend]
  pull_request:
    branches: [frontend]

jobs:
  build:
    name: Build ${{ matrix.name }} installer
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            runtime_target: darwin
            build_script: build:mac
            screenpipe_pkg: "@screenpipe/cli-darwin-arm64"
          - name: Windows
            os: windows-latest
            runtime_target: windows
            build_script: build:win
            screenpipe_pkg: "@screenpipe/cli-win32-x64"
          - name: Linux
            os: ubuntu-latest
            runtime_target: linux
            build_script: build:linux
            screenpipe_pkg: "@screenpipe/cli-linux-x64"
    steps:
      - name: Checkout frontend
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Screenpipe CLI binary
        shell: bash
        run: |
          npm install --no-save ${{ matrix.screenpipe_pkg }}
          if [ "${{ matrix.runtime_target }}" = "darwin" ]; then
            npm install --no-save @screenpipe/cli-darwin-x64
          fi

      - name: Detect bundled Screenpipe binary
        shell: bash
        run: |
          echo "=== Listing screenpipe npm package contents ==="
          node -e "const fs=require('fs');const pkg='${{ matrix.screenpipe_pkg }}';const candidates=[pkg,'@'+pkg.replace('@','').replace('/','/')].map(p=>'node_modules/'+p+'/bin');const dir=candidates.find(d=>fs.existsSync(d));if(dir){console.log('Found:',dir);fs.readdirSync(dir).forEach(f=>console.log('  ',f));}else{console.log('Not found in:',candidates);}"
          SCREENPIPE_DIR="$(node -e "
            const fs=require('fs');
            const path=require('path');
            const pkg='${{ matrix.screenpipe_pkg }}';
            const roots=[
              path.join('node_modules', pkg, 'bin'),
              path.join('node_modules', pkg.replace('@','').replace('/','+'), 'bin')
            ];
            const dir=roots.find(d=>fs.existsSync(d));
            if(!dir){process.exit(1)}
            process.stdout.write(path.resolve(dir));
          ")"
          echo "JARVIS_SCREENPIPE_BIN_DIR_SRC=${SCREENPIPE_DIR}" >> "$GITHUB_ENV"
          if [ "${{ matrix.runtime_target }}" = "windows" ]; then
            echo "JARVIS_SCREENPIPE_BIN_SRC=${SCREENPIPE_DIR}/screenpipe.exe" >> "$GITHUB_ENV"
          else
            echo "JARVIS_SCREENPIPE_BIN_SRC=${SCREENPIPE_DIR}/screenpipe" >> "$GITHUB_ENV"
          fi
          if [ "${{ matrix.runtime_target }}" = "darwin" ]; then
            ARM64_DIR="$(node -e "
              const fs=require('fs');
              const path=require('path');
              const roots=[
                path.join('node_modules', '@screenpipe/cli-darwin-arm64', 'bin'),
                path.join('node_modules', 'screenpipe+cli-darwin-arm64', 'bin')
              ];
              const dir=roots.find(d=>fs.existsSync(d));
              if(dir){process.stdout.write(path.resolve(dir))}
            ")"
            if [ -n "${ARM64_DIR}" ]; then
              echo "JARVIS_SCREENPIPE_ARM64_DIR_SRC=${ARM64_DIR}" >> "$GITHUB_ENV"
            fi
            X64_DIR="$(node -e "
              const fs=require('fs');
              const path=require('path');
              const roots=[
                path.join('node_modules', '@screenpipe/cli-darwin-x64', 'bin'),
                path.join('node_modules', 'screenpipe+cli-darwin-x64', 'bin')
              ];
              const dir=roots.find(d=>fs.existsSync(d));
              if(dir){process.stdout.write(path.resolve(dir))}
            ")"
            if [ -n "${X64_DIR}" ]; then
              echo "JARVIS_SCREENPIPE_X64_DIR_SRC=${X64_DIR}" >> "$GITHUB_ENV"
            fi
          fi

      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          repository: devmehta-dinanath/Jarvis-bot
          ref: backend
          path: backend-src

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend build dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install pyinstaller
          if [ "${{ matrix.runtime_target }}" = "windows" ]; then
            pip install paddlepaddle==2.6.2 -i https://www.paddlepaddle.org.cn/packages/stable/cpu/
          else
            pip install paddlepaddle==2.6.2
          fi
          pip install -r backend-src/requirements-client.txt

      - name: Build backend executable
        shell: bash
        run: |
          cd backend-src
          pyinstaller backend-client.spec --noconfirm --clean
          BACKEND_BIN="$(node -e "
            const fs=require('fs');
            const path=require('path');
            const candidates=['dist/backend.exe','dist/backend'];
            const found=candidates.find((file)=>fs.existsSync(file));
            if(!found){
              console.error('Backend binary was not produced.');
              try {
                console.error(fs.readdirSync('dist').join(', '));
              } catch (err) {
                console.error('dist/ is missing');
              }
              process.exit(1);
            }
            process.stdout.write(path.resolve(found));
          ")"
          echo "JARVIS_BACKEND_BIN_SRC=${BACKEND_BIN}" >> "$GITHUB_ENV"
          echo "Built backend binary at ${BACKEND_BIN}"

      - name: Stage runtime binaries
        shell: bash
        env:
          RUNTIME_TARGET: ${{ matrix.runtime_target }}
          REQUIRE_RUNTIME_BINARIES: "1"
        run: npm run stage:runtime

      - name: Verify staged binaries
        shell: bash
        run: |
          echo "=== Staged resources for ${{ matrix.runtime_target }} ==="
          if [ "${{ matrix.runtime_target }}" = "windows" ]; then
            ls -la resources/win/ || echo "win folder missing"
            ls -la resources/win/screenpipe-lib/ || echo "screenpipe-lib folder missing"
            echo "=== Checking Windows DLLs ==="
            ls resources/win/screenpipe-lib/ | grep -i "\.dll" || echo "No DLLs found"
          elif [ "${{ matrix.runtime_target }}" = "darwin" ]; then
            ls -la resources/mac/ || echo "mac folder missing"
            ls -la resources/mac/screenpipe-lib/ || echo "screenpipe-lib folder missing"
            echo "=== Testing screenpipe on macOS ==="
            xattr -cr resources/mac/screenpipe-lib/ 2>/dev/null || true
            chmod +x resources/mac/screenpipe-lib/screenpipe 2>/dev/null || true
            resources/mac/screenpipe-lib/screenpipe --version 2>&1 || echo "screenpipe --version failed (needs signing for end-user use)"
          else
            ls -la resources/linux/ || echo "linux folder missing"
            ls -la resources/linux/screenpipe-lib/ || echo "screenpipe-lib folder missing"
            echo "=== Testing Linux screenpipe ==="
            chmod +x resources/linux/screenpipe-lib/screenpipe 2>/dev/null || true
            resources/linux/screenpipe-lib/screenpipe --version 2>&1 || echo "screenpipe --version failed"
          fi

      - name: Build installer
        run: npm run ${{ matrix.build_script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-${{ matrix.runtime_target }}-installers
          path: release/*
          if-no-files-found: error
