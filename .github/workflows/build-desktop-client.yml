name: Build Desktop Client

on:
  workflow_dispatch:
  push:
    branches: [frontend]
  pull_request:
    branches: [frontend]

jobs:
  build:
    name: Build ${{ matrix.name }} installer
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            runtime_target: darwin
            build_script: build:mac
            screenpipe_pkg: "@screenpipe/cli-darwin-arm64"
          - name: Windows
            os: windows-latest
            runtime_target: windows
            build_script: build:win
            screenpipe_pkg: "@screenpipe/cli-win32-x64"
          - name: Linux
            os: ubuntu-latest
            runtime_target: linux
            build_script: build:linux
            screenpipe_pkg: "@screenpipe/cli-linux-x64"
    steps:
      - name: Checkout frontend
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Screenpipe CLI binary
        run: npm install --no-save ${{ matrix.screenpipe_pkg }}

      - name: Detect bundled Screenpipe binary
        shell: bash
        run: |
          SCREENPIPE_DIR="$(node -e "
            const fs=require('fs');
            const path=require('path');
            const pkg='${{ matrix.screenpipe_pkg }}';
            const roots=[
              path.join('node_modules', pkg, 'bin'),
              path.join('node_modules', pkg.replace('@','').replace('/','+'), 'bin')
            ];
            const dir=roots.find(d=>fs.existsSync(d));
            if(!dir){process.exit(1)}
            process.stdout.write(path.resolve(dir));
          ")"
          echo "JARVIS_SCREENPIPE_BIN_DIR_SRC=${SCREENPIPE_DIR}" >> "$GITHUB_ENV"
          if [ "${{ matrix.runtime_target }}" = "windows" ]; then
            echo "JARVIS_SCREENPIPE_BIN_SRC=${SCREENPIPE_DIR}/screenpipe.exe" >> "$GITHUB_ENV"
          else
            echo "JARVIS_SCREENPIPE_BIN_SRC=${SCREENPIPE_DIR}/screenpipe" >> "$GITHUB_ENV"
          fi

      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          repository: devmehta-dinanath/Jarvis-bot
          ref: backend
          path: backend-src

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend build dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install pyinstaller
          if [ "${{ matrix.runtime_target }}" = "windows" ]; then
            pip install paddlepaddle==2.6.2 -i https://www.paddlepaddle.org.cn/packages/stable/cpu/
          else
            pip install paddlepaddle==2.6.2
          fi
          pip install -r backend-src/requirements-client.txt

      - name: Build backend executable
        shell: bash
        run: |
          cd backend-src
          pyinstaller backend-client.spec --noconfirm --clean
          BACKEND_BIN="$(node -e "
            const fs=require('fs');
            const path=require('path');
            const candidates=['dist/backend.exe','dist/backend'];
            const found=candidates.find((file)=>fs.existsSync(file));
            if(!found){
              console.error('Backend binary was not produced.');
              try {
                console.error(fs.readdirSync('dist').join(', '));
              } catch (err) {
                console.error('dist/ is missing');
              }
              process.exit(1);
            }
            process.stdout.write(path.resolve(found));
          ")"
          echo "JARVIS_BACKEND_BIN_SRC=${BACKEND_BIN}" >> "$GITHUB_ENV"
          echo "Built backend binary at ${BACKEND_BIN}"

      - name: Stage runtime binaries
        shell: bash
        env:
          RUNTIME_TARGET: ${{ matrix.runtime_target }}
          REQUIRE_RUNTIME_BINARIES: "1"
        run: npm run stage:runtime

      - name: Build installer
        run: npm run ${{ matrix.build_script }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-${{ matrix.runtime_target }}-installers
          path: release/*
          if-no-files-found: error
